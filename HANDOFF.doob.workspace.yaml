- id: doob-6
  name: gh-sync
  priority: P1
  status: done
  title: GitHub issue sync — doob todo gh-sync subcommand + PostToolUse hook
  description: |
    New gh_sync lib module syncs doob todos to GitHub issues. Subcommand
    `doob todo gh-sync` with --execute (dry-run by default), --uuid, --force,
    --action, --json. PostToolUse hook fires on doob todo add/complete/remove
    and passes --action hint. Config at ~/.config/doob/gh-sync.toml with owner,
    allowlist, close_on_complete, tombstone_on_remove. State file at
    ~/.config/doob/gh-sync-state.json (atomic writes). Table output grouped by
    repo, colorized, JSON-serializable via --json global flag.
  files:
  - src/gh_sync/config.rs
  - src/gh_sync/mapper.rs
  - src/gh_sync/state.rs
  - src/gh_sync/github.rs
  - src/gh_sync/mod.rs
  - src/commands/gh_sync.rs
  - src/cli.rs
  - src/main.rs
  extra: []
  completed: 2026-04-10
