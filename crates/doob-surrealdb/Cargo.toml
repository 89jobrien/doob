[package]
name = "doob-surrealdb"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
doob-core = { path = "../doob-core" }
surrealdb = { version = "2", features = ["kv-surrealkv"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
uuid = { version = "1", features = ["v4"] }
