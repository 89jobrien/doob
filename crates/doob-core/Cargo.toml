[package]
name = "doob-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2.0"
git2 = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }
dirs-next = "2"
surrealdb = { version = "2", features = ["kv-surrealkv"], optional = true }

[features]
default = ["surrealdb-backend"]
surrealdb-backend = ["dep:surrealdb"]
