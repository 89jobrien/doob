[package]
name = "doob"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "doob"
path = "src/lib.rs"

[[bin]]
name = "doob"
path = "src/main.rs"

[features]
default = ["surrealdb"]
sqlite = ["dep:doob-sqlite"]
surrealdb = ["dep:doob-surrealdb"]

[dependencies]
doob-core = { path = "../doob-core" }
doob-sqlite = { path = "../doob-sqlite", optional = true }
doob-surrealdb = { path = "../doob-surrealdb", optional = true }
doob-gh = { path = "../doob-gh" }
doob-sync = { path = "../doob-sync" }
doob-beads = { path = "../doob-beads" }

async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs-next = "2"
serde_yaml = "0.9"
colored = "2"

[dev-dependencies]
git2 = "0.19"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serial_test = "3.3.1"
