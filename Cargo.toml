[workspace]
members = [".", "crates/doobdash"]
resolver = "2"

[package]
name = "doob"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "doob"
path = "src/lib.rs"

[[bin]]
name = "doob"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
surrealdb = { version = "2", features = ["kv-surrealkv"], optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1"
git2 = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }
dirs-next = "2"
serde_yaml = "0.9"
toml = "0.8"
colored = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serial_test = "3.3.1"

[features]
default = ["surrealdb-backend"]
surrealdb-backend = ["dep:surrealdb"]
integration-tests = []
